<!DOCTYPE html>
<html>
  <head>
    <title>Cart Quantity</title>
  </head>

  <body>

    <button onclick="
      document.getElementById('result').innerHTML =
      `Cart quantity: ${cartQuantity}`;
    ">Show Quantity</button>

    <button onclick="
      cartQuantity++;
      document.getElementById('result').innerHTML =
      `Cart quantity: ${cartQuantity}`;
    ">Add to Cart</button>

    <button onclick="
      cartQuantity += 2;
      document.getElementById('result').innerHTML =
      `Cart quantity: ${cartQuantity}`;
    ">+2</button>

    <button onclick="
      cartQuantity += 3;
      document.getElementById('result').innerHTML =
      `Cart quantity: ${cartQuantity}`;
    ">+3</button>

    <button onclick="
      cartQuantity = 0;
      document.getElementById('result').innerHTML =
      `Cart quantity: ${cartQuantity}`;
    ">Reset Cart</button>

    <p id="result"></p>

    <script>
      let cartQuantity = 0;
    </script>

  </body>
</html>
